# Dependabot keeps npm/Bun and GitHub Actions dependencies current.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Formatter bumps must be manual: a Biome minor (e.g. 2.6.x) reformats the
    # repo and fails `bunx biome ci` unless `bun run format` lands in the same
    # PR. Bump deliberately instead.
    ignore:
      - dependency-name: "@biomejs/biome"
    commit-message:
      prefix: chore
      include: scope
    groups:
      astro:
        patterns:
          - "@astrojs/*"
          - "astro"
      svelte:
        patterns:
          - "svelte*"
          - "@lucide/svelte"
      drizzle:
        patterns:
          - "drizzle-*"
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
        exclude-patterns:
          - "@biomejs/biome"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
