name: E2E

# Blocking Playwright + integration — not on every draft push.
# Integration runs once in the same job before Playwright (one reset, one build:e2e).
# Runs when a non-draft PR is opened, pushed to, marked ready, reopened, or labeled `run/e2e`.
# Drafts stay cheap. cancel-in-progress dedupes push storms per PR.
# See docs/testing.md § Heavy CI gating.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".cursor/**"

concurrency:
  group: e2e-blocking-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
      (github.event.action == 'synchronize' && github.event.pull_request.draft == false) ||
      (github.event.action == 'reopened' && github.event.pull_request.draft == false) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run/e2e'))
    uses: ./.github/workflows/e2e-reusable.yml
    secrets: inherit
    with:
      suite: blocking
