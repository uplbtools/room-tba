name: CI

# Verify: focused Biome check, unit + component tests, build.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".cursor/**"
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".cursor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: us5.datadoghq.com
      DD_ENV: ci
      DD_SERVICE: room-tba
      DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
      DD_CIVISIBILITY_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: mkdir -p node_modules && bun install --frozen-lockfile

      - name: Biome check (PR fix files)
        run: bunx biome ci src/lib/components/AccountSettingsModal.svelte src/lib/services/contribution/contributor-profile.ts

      - name: CI command coverage
        run: bun run scripts/check-ci-commands.ts

      - name: Unit tests
        run: bun run test:unit -- --run --project server --reporter=junit --outputFile=junit-unit.xml

      - name: Retire feature coverage with retired pages
        env:
          TEST_RETIREMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:feature-test-retirement

      - name: Component tests
        env:
          NODE_OPTIONS: -r dd-trace/ci/init
        run:
          bun run test:components -- --reporter=junit --outputFile=junit-components.xml

      - name: Upload git metadata to Datadog
        if: always()
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog git metadata upload: DD_API_KEY not configured"
            exit 0
          fi
          bunx datadog-ci git-metadata upload

      - name: Upload test results to Datadog
        if: always()
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "Skipping Datadog junit upload: DD_API_KEY not configured"
            exit 0
          fi
          bunx datadog-ci junit upload --service room-tba junit-unit.xml junit-components.xml

      - name: Build
        if: github.actor != 'dependabot[bot]'
        env:
          # Fork PRs get no secrets, and the build only needs this variable to
          # exist for env-schema validation — nothing queries at build time.
          # Without the fallback every outside contribution fails here (#790).
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder' }}
          DD_GIT_COMMIT_SHA: ${{ github.sha }}
          DD_GIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
          DD_GIT_BRANCH: ${{ github.ref_name }}
          DD_VERSION: ${{ github.sha }}
        run: bun run build

  migrations:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      # #806: since #773 nothing applies migrations to the E2E `public` schema,
      # so checking it failed every PR that added one. Build the same kind of
      # per-run schema the E2E jobs build, then check that.
      E2E_SCHEMA: e2e_migrations_${{ github.run_id }}_${{ github.run_attempt }}
      # A fork PR has no database credentials, so this check cannot run. Say so
      # plainly and pass, rather than failing on infrastructure the contributor
      # has no way to fix (#790). A maintainer runs it on the mirrored branch.
      HAS_DB: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin: bun 1.3.14 regressed `--frozen-lockfile` (ENOENT: could not
          # open the "node_modules" directory on a fresh checkout), breaking
          # every job. Unpin once upstream ships a fix.
          bun-version: 1.3.12

      - name: Install dependencies
        run: mkdir -p node_modules && bun install --frozen-lockfile

      - name: Migrate a throwaway run schema
        if: env.HAS_DB == 'true'
        run: bun run e2e:reset-db

      - name: Schema tables present
        if: env.HAS_DB == 'true'
        run: bun run check:migrations

      - name: Drop run schema
        if: always() && env.HAS_DB == 'true'
        continue-on-error: true # stale schemas are swept on the next reset anyway
        run: bun run scripts/e2e-reset-db.ts --drop

      - name: Schema check skipped (fork PR)
        if: env.HAS_DB != 'true'
        run: echo "::notice::Skipped — fork PRs cannot access database secrets. A maintainer will run this before merge."
