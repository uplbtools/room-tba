name: E2E (reusable)

on:
  workflow_call:
    inputs:
      suite:
        description: blocking or advisory
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      # #773: own schema per run so blocking/advisory/staging stop racing.
      E2E_SCHEMA: e2e_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_SESSION_SECRET: ${{ secrets.E2E_ADMIN_SESSION_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.E2E_ADMIN_SESSION_SECRET }}
      PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
      CI: true
      SKIP_E2E_BUILD: "1"
      # #782: the E2E project's session pooler caps at pool_size 15 and four
      # heavy jobs overlap routinely (blocking + advisory for two PRs). Two per
      # process keeps the whole fleet under the ceiling. 2 is also the floor: a
      # few edit-conflict paths read through the global `db` while a transaction
      # holds a client, so 1 would deadlock. See docs/testing.md
      # § Connection budget before changing it either way.
      DATABASE_POOL_MAX: "2"
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12" # pin: bun 1.3.14 broke --frozen-lockfile

      - name: Install dependencies
        run: mkdir -p node_modules && bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Reset E2E database
        run: bun run e2e:reset-db

      - name: Build for E2E preview
        env:
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
        run: bun run build:e2e

      - name: Start preview server
        if: inputs.suite == 'blocking'
        run: |
          bun run preview:e2e &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4321/api/health && exit 0
            sleep 2
          done
          echo "Preview failed to start"
          exit 1

      - name: Integration tests
        if: inputs.suite == 'blocking'
        run: PREVIEW_BASE_URL=http://127.0.0.1:4321 bun run test:integration

      - name: Restart preview after integration
        if: inputs.suite == 'blocking'
        run: |
          fuser -k 4321/tcp 2>/dev/null || true
          sleep 2
          ASTRO_E2E_SKIP_LOGIN_RATE_LIMIT=1 bun run preview:e2e &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4321/api/health && exit 0
            sleep 2
          done
          echo "Preview failed to restart after integration"
          exit 1

      - name: Playwright blocking tests
        if: inputs.suite == 'blocking'
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          ASTRO_E2E_SKIP_LOGIN_RATE_LIMIT: "1"
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
        run: bun run e2e

      - name: Playwright advisory tests
        if: inputs.suite == 'advisory'
        continue-on-error: true
        env:
          ASTRO_E2E_SKIP_LOGIN_RATE_LIMIT: "1"
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
        run: bun run e2e:advisory

      - name: Advisory failure notice
        if: failure() && inputs.suite == 'advisory'
        run: echo "::warning::Advisory E2E failed — review Playwright report (non-blocking)"

      - name: Drop E2E schema
        if: always()
        continue-on-error: true # stale schemas are swept on the next reset anyway
        run: bun run scripts/e2e-reset-db.ts --drop

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.suite }}-${{ github.run_id }}
          path: playwright-report/
